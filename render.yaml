# Render.com free-tier deploy.
# 1. Push this repo to GitHub.
# 2. On render.com → New → Blueprint → pick the repo. Render reads this file.
# 3. (Optional) add ANTHROPIC_API_KEY in the dashboard to enable the LLM agent;
#    without it the app runs in rule-based fallback mode.
services:
  - type: web
    name: samadhan-agent
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "claude-haiku-4-5-20251001"
      # Government Portal login code — set your own value in the dashboard.
      - key: OFFICIAL_KEY
        sync: false
      # Persistent Postgres. Paste your database's Internal URL in the dashboard
      # so grievances survive redeploys. Without it the app uses ephemeral SQLite.
      - key: DATABASE_URL
        sync: false
